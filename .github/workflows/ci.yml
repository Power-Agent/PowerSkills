name: CI

on:
  push:
    branches:
      - main
      - "fix/quick-validator-utf8"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-regression:
    name: Validator and packaging regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run skill-creator regression tests
        run: python -m pytest -q skill-creator/tests

      - name: Compile validator and tests
        run: python -m compileall -q skill-creator/scripts skill-creator/tests
